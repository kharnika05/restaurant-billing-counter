version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: restaurant_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurant_billing_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - restaurant_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_backend
    restart: always
    depends_on:
      - mysqldb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/restaurant_billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: c2VjdXJpdHktc3ByaW5nLWJvb3QtcmVzdGF1cmFudC1iaWxsaW5nLWtleS0yMDI2LXNlY3VyZQ==
    ports:
      - "8080:8080"
    networks:
      - restaurant_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - restaurant_network

volumes:
  mysql_data:

networks:
  restaurant_network:
    driver: bridge
